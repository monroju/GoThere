# Project-wide Gradle settings

# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin style
kotlin.code.style=official

# Kotlin daemon optimization
kotlin.daemon.jvmargs=-Xmx2048m

# Gradle daemon optimization (single, merged line)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens java.base/java.lang=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Force Gradle to use Android Studio's bundled JDK (ADJUST PATH IF NEEDED)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
