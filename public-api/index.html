<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GoThere API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #F7F8FA;
    color: #1A1A24;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
    background: white;
    border-radius: 14px;
    padding: 2rem 2.25rem;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.5rem;
    color: #15B8A6;
    margin-bottom: 0.5rem;
  }
  p {
    color: #4a4a55;
    line-height: 1.55;
    margin-top: 0.75rem;
  }
  a { color: #15B8A6; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    background: #eef0f4;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>GoThere API</h1>
    <p>This is a backend endpoint for the GoThere iOS and Android apps. There's nothing for you to see here.</p>
    <p>Looking for the app? <a href="https://getgothere.app/">getgothere.app</a>.</p>
  </div>
</body>
</html>
